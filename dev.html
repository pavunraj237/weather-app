<html>
    <head>
        <title>WEATHER APP</title>
        <link rel="stylesheet "href="style.css">
        <link rel="icon" href="data:,">
    </head>
    <body>
 <div class="card">
    <div class="search">
        <input type="text"placeholder="enter city name"spellcheck="false">
        <button><img src="./img/8-removebg-preview.png" alt=""></button>
    </div>
       <div class="weather">
            <img src="./img/mist.png.jpeg" class="weather-icon">
            <h1 class="temp">22°c</h1>
              <h2 class="city">USA</h2>
<div class="details">
    <div class="col">
        <img src="./img/5.jpeg">
        <div><p class="humidity">50%</p>
            <p>humidity</p>
    </div>
</div>
<div class="details">
    <div class="col">
        <img src="./img/6.jpeg">
        <div><p class="wind">15km/hr</p>
            <p>wind speed</p>
    </div>
</div>
        </div>
    </div>
 </div> 
 <script>
const apiKey = "YOUR_OPENWEATHER_API_KEY";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weatherIcon=document.querySelector(".weather-icon");

async function checkweather(city) {
  const response = await fetch(apiUrl + city + "&appid=" + apiKey);

  if (!response.ok) {
    alert("City not found");
    return;
  }

  const data = await response.json();
  console.log(data);

  document.querySelector(".city").innerHTML = data.name;
  document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
  document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
  document.querySelector(".wind").innerHTML = data.wind.speed + " km/hr";

 if (data.weather[0].main === "Clouds") {
    weatherIcon.src = "./img/clouds.png.jpeg";
}
else if (data.weather[0].main === "Clear") {
    weatherIcon.src = "./img/clear.png.jpeg";
}
else if (data.weather[0].main === "Rain") {
    weatherIcon.src = "./img/rain.png.jpeg";
}
else if (data.weather[0].main === "Drizzle") {
    weatherIcon.src = "./img/drizzle.png.jpeg";
}
else if (data.weather[0].main === "Mist") {
    weatherIcon.src = "./img/mist.png.jpeg";
}/*const weather = data.weather[0].main;

if (weather === "Clouds") {
    weatherIcon.src = "img/clouds.png";
}
else if (weather === "Clear") {
    weatherIcon.src = "img/clear.png";
}
else if (weather === "Rain") {
    weatherIcon.src = "img/rain.png";
}
else if (weather === "drizzle") {
    weatherIcon.src = "img/drizzle.png";
}
else if (weather === "Mist") {
    weatherIcon.src = "img/mist.png";
}
else {
    weatherIcon.src = "img/default.png";
}*/

  document.querySelector(".weather").style.display="block";
}


searchBtn.addEventListener("click", () => {
  checkweather(searchBox.value);
});
</script>

    </body> 
</html>
